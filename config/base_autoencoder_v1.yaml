# 自编码器 v1 基础配置

data_config:
  train_path: "/home/zhangxueyou/PycharmProjects/scene_reco2/data/map_masks/scene_raster_trainval_train_700scenes.pkl"
  test_path: "/home/zhangxueyou/PycharmProjects/scene_reco2/data/map_masks/scene_raster_trainval_val_150scenes.pkl"
  train_val_split: 0.9

data_processing:
  input_channels: 4
  input_height: 700
  input_width: 400
  normalize: true

model_config:
  encoder:
    hidden_dim: 512
    conv_layers: 5
    base_channels: 32
    channel_multiplier: 2
    kernel_size: 3
    stride: 2
    padding: 1
    activation: "relu"
    use_batch_norm: true
  decoder:
    conv_layers: 5
    kernel_size: 3
    stride: 2
    padding: 1
    output_padding: 0
    activation: "relu"
    use_batch_norm: true
    output_activation: "sigmoid"

training_config:
  batch_size: 16
  learning_rate: 0.001
  epochs: 50
  optimizer: "adam"
  weight_decay: 0.00001
  loss_function: "bce"
  lr_scheduler:
    type: "step"
    step_size: 20
    gamma: 0.5
  checkpoint:
    save_final_only: true
    save_dir: "/home/zhangxueyou/PycharmProjects/scene_reco2/checkpoints"

visualization_config:
  wandb:
    enabled: true
  training_visualization:
    enabled: true
  test_visualization:
    enabled: true
    save_results: true
    results_dir: "/home/zhangxueyou/PycharmProjects/scene_reco2/sample_results"
    num_test_samples: 50

device_config:
  use_cuda: true
  gpu_id: 0
  num_workers: 4
  pin_memory: true

output_config:
  model_save_path: "/home/zhangxueyou/PycharmProjects/scene_reco2/models"
  logs_dir: "/home/zhangxueyou/PycharmProjects/scene_reco2/logs"

random_seed: 42
