# 自编码器 v2 基础配置

data_config:
  train_path: "/home/zhangxueyou/PycharmProjects/scene_reco2/data/map_masks/scene_raster_trainval_train_700scenes.pkl"
  test_path: "/home/zhangxueyou/PycharmProjects/scene_reco2/data/map_masks/scene_raster_trainval_val_150scenes.pkl"
  train_val_split: 0.85

data_processing:
  grid_height: 512
  grid_width: 512
  use_ego_trajectory: true
  base_channels: 3
  normalize: true

model_config:
  encoder:
    hidden_dim: 1024
    use_attention: true
  decoder:
    use_skip_connections: true

training_config:
  batch_size: 32
  epochs: 30
  use_amp: true
  grad_clip: 1.0
  optimizer_config:
    type: "adamw"
    encoder_lr: 0.0001
    decoder_lr: 0.0002
    weight_decay: 0.0001
    beta1: 0.9
    beta2: 0.999
  scheduler_config:
    type: "cosine"
    T_0: 10
    T_mult: 2
    eta_min: 0.000001
  warmup_config:
    enabled: true
    epochs: 5
    factor: 0.1
  loss_config:
    channel_weights: [0.4, 0.25, 0.25, 0.1]
    focal_alpha: 0.25
    focal_gamma: 2.0
    focal_weight: 0.4
    ssim_weight: 0.3
    mse_weight: 0.2
    reg_weight: 0.1
  early_stopping_patience: 15
  early_stopping_delta: 0.0001
  checkpoint:
    save_dir: "/home/zhangxueyou/PycharmProjects/scene_reco2/checkpoints"
    save_freq: 10

visualization_config:
  test_visualization:
    enabled: true
    save_results: true
    results_dir: "/home/zhangxueyou/PycharmProjects/scene_reco2/results_v2"
    num_test_samples: 50

device_config:
  use_cuda: true
  gpu_id: 0
  num_workers: 8
  pin_memory: true

output_config:
  model_save_path: "/home/zhangxueyou/PycharmProjects/scene_reco2/models"

random_seed: 42
